<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz App</title>
    <link rel="stylesheet" href="CSS/instruction.css">
</head>
<body>
    <div class="quiz-container">
        <div class="quiz-header">
            <h1>Instructions</h1>
        </div>

        <div class="instructions">
            <ul>
                <li>Total Questions: 10</li>
                <li>Each question has 4 options.</li>
                <li>Select only one option.</li>
                <li>Timer: 15 seconds per question.</li>
                <li>Score shown at end.</li>
            </ul>
        </div>

        <div class="quiz-actions">
            <a href="userdetail.html">
                <button class="btn start-btn">START NOW</button>
            </a>
            
            <a href="index.html">
                <button class="btn back-btn">GO BACK</button>
            </a>
        </div>
    </div>
</body>
</html>
